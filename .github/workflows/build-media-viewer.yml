name: Build WebRad media viewer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Test packaging scripts
        run: python3 scripts/test-build-media-viewer.py
      - run: mvn -B clean install
      - run: mvn -B -f weasis-distributions/pom.xml clean package
      - uses: actions/upload-artifact@v4
        with:
          name: native-payload
          path: weasis-distributions/target/native-dist/weasis-native.zip
          if-no-files-found: error
  native:
    needs: payload
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: windows-x86-64
          - os: macos-15-intel
            arch: macosx-x86-64
          - os: macos-latest
            arch: macosx-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/download-artifact@v4
        with:
          name: native-payload
          path: payload
      - name: Extract native payload
        shell: bash
        run: unzip -q payload/weasis-native.zip -d payload/extracted
      - name: Build native archive
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          bash scripts/build-media-viewer.sh payload/extracted native-output
          test -s "native-output/$EXPECTED_ARCH.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-${{ matrix.arch }}
          path: native-output/*.zip
          if-no-files-found: error
  assemble:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: viewer-*
          merge-multiple: true
          path: native-output
      - run: python3 scripts/assemble-media-viewer.py native-output output/web-rad-viewer-media.zip
      - uses: actions/upload-artifact@v4
        with:
          name: web-rad-viewer-media
          path: output/*
          if-no-files-found: error
